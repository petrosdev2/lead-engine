<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Lead Engine</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#F2F5F3; --surface:#FFFFFF; --ink:#13221E; --muted:#5B6B65; --line:#D3DCD7;
  --pine:#1D5B49; --pine-ink:#FFFFFF; --pine-soft:#DDEBE5;
  --amber:#E3A125; --amber-ink:#2B1D00; --amber-soft:#FBEFD3;
  --clay:#B2432E; --clay-soft:#F6E0DB;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1917; --surface:#16231F; --ink:#E7EFEB; --muted:#93A59E; --line:#2A3A35;
    --pine:#5FC2A3; --pine-ink:#0B1513; --pine-soft:#1D332C;
    --amber:#F0B748; --amber-ink:#241800; --amber-soft:#3A2F14;
    --clay:#E5846F; --clay-soft:#3B201A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1917; --surface:#16231F; --ink:#E7EFEB; --muted:#93A59E; --line:#2A3A35;
  --pine:#5FC2A3; --pine-ink:#0B1513; --pine-soft:#1D332C;
  --amber:#F0B748; --amber-ink:#241800; --amber-soft:#3A2F14;
  --clay:#E5846F; --clay-soft:#3B201A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; min-height:100%; background:var(--paper); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit; color:inherit}
h1,h2,h3{font-family:var(--display); margin:0; line-height:1.15}
h1{font-size:clamp(1.9rem,4vw,2.6rem); font-weight:700; letter-spacing:-0.02em}
h2{font-size:1.15rem; font-weight:650}
h3{font-size:1.02rem; font-weight:650}
p{margin:0}
:focus-visible{outline:2px solid var(--pine); outline-offset:2px; border-radius:4px}

.app{display:grid; grid-template-columns:216px minmax(0,1fr); min-height:100%}
.rail{background:var(--surface); border-right:1px solid var(--line); padding:22px 14px}
.rail-in{position:sticky; top:22px; display:flex; flex-direction:column; gap:22px}
.brand{font-family:var(--display); font-weight:800; font-size:1.3rem; letter-spacing:-0.02em; padding:0 8px}
.brand small{display:block; font-family:var(--body); font-weight:400; font-size:.78rem; color:var(--muted); letter-spacing:0; margin-top:2px}
.nav{display:flex; flex-direction:column; gap:2px}
.nav button{all:unset; cursor:pointer; padding:9px 10px; border-radius:8px; display:flex; justify-content:space-between; align-items:center; font-weight:500}
.nav button:hover{background:var(--paper)}
.nav button[aria-current="page"]{background:var(--pine-soft); color:var(--ink); font-weight:600}
.nav .n{font-size:.78rem; background:var(--amber); color:var(--amber-ink); border-radius:99px; padding:0 7px; font-weight:600; font-variant-numeric:tabular-nums}
.rail .foot{font-size:.78rem; color:var(--muted); padding:0 8px}
main{padding:34px clamp(16px,4vw,48px) 80px; max-width:1040px; width:100%}
.head{margin-bottom:26px}
.head .sub{color:var(--muted); margin-top:6px; max-width:62ch}

.btn{appearance:none; border:1px solid var(--line); background:var(--surface); padding:7px 13px; border-radius:8px; cursor:pointer; font-weight:500; white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--pine); border-color:var(--pine); color:var(--pine-ink); font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.warn{color:var(--clay); border-color:var(--clay)}
.btn.small{padding:4px 10px; font-size:.86rem}
.btn[disabled]{opacity:.5; cursor:not-allowed}
a.btn{text-decoration:none; display:inline-block; color:var(--ink)}
.badge.wa{background:var(--pine-soft); border-color:var(--pine); vertical-align:2px; margin-left:4px}
.linklike{all:unset; cursor:pointer; font:inherit}
.linklike:hover{text-decoration:underline}

.gate{background:var(--surface); border:1px solid var(--line); border-left:5px solid var(--amber); border-radius:10px; padding:14px 18px; margin-bottom:28px}
.gate.pass{border-left-color:var(--pine)} .gate.fail{border-left-color:var(--clay)}
.gate p{max-width:70ch}
.meter{height:8px; background:var(--paper); border-radius:99px; margin-top:10px; overflow:hidden}
.meter i{display:block; height:100%; background:var(--amber); border-radius:99px}

.block{margin-bottom:34px}
.block > header{display:flex; align-items:baseline; gap:10px; margin-bottom:10px; flex-wrap:wrap}
.block > header .count{color:var(--muted); font-variant-numeric:tabular-nums}
.block > header .hint{color:var(--muted); font-size:.88rem; margin-left:auto}
.empty{border:1px dashed var(--line); border-radius:10px; padding:18px; color:var(--muted)}

.lead{display:grid; grid-template-columns:56px minmax(0,1fr) auto; gap:14px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:8px}
.lead .where{color:var(--muted); font-size:.9rem}
.lead .due{font-size:.88rem; font-weight:500; margin-top:4px}
.lead .due.late{color:var(--clay)}
.acts{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end}
.stamp{width:56px; height:56px; border-radius:12px; display:grid; place-items:center; align-content:center; font-family:var(--display); line-height:1; border:2px solid var(--line); color:var(--muted)}
.stamp b{font-size:1.6rem; font-weight:800}
.stamp span{font-size:.7rem; font-weight:600; margin-top:2px; font-variant-numeric:tabular-nums}
.stamp.tA{background:var(--amber); border-color:var(--amber); color:var(--amber-ink)}
.stamp.tB{border-color:var(--pine); color:var(--pine); background:var(--pine-soft)}
.stamp.tX,.stamp.tP{border-style:dashed}
.signals{list-style:none; margin:6px 0 0; padding:0; display:flex; flex-wrap:wrap; gap:4px 12px; font-size:.84rem; color:var(--muted)}
.signals li::before{content:""; display:inline-block; width:7px; height:7px; border-radius:50%; border:1.5px solid var(--muted); margin-right:6px; vertical-align:1px}
.signals li.on{color:var(--ink)}
.signals li.on::before{background:var(--pine); border-color:var(--pine)}
.signals li.offer{color:var(--pine); font-weight:600}
.signals li.offer::before{display:none}
.probs{list-style:none; margin:0; padding:0; display:grid; gap:6px}
.probs li{display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:8px 10px; background:var(--paper); border-radius:8px; font-weight:500}
.probs li span{color:var(--muted); font-weight:400; font-size:.86rem; text-align:right}
.num{font-variant-numeric:tabular-nums; user-select:all; color:var(--ink); font-weight:500}
.block .pills{margin:0 0 10px}
.note a{color:var(--pine); overflow-wrap:anywhere}
input[type=password]{border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:7px 10px; width:100%; min-width:0}
.badge{display:inline-block; font-size:.78rem; font-weight:600; padding:1px 8px; border-radius:99px; background:var(--paper); border:1px solid var(--line)}
.badge.s-won{background:var(--pine); color:var(--pine-ink); border-color:var(--pine)}
.badge.s-replied,.badge.s-booked{background:var(--amber-soft); border-color:var(--amber)}
.badge.s-lost,.badge.s-unsub,.badge.s-dnc{background:var(--clay-soft); border-color:var(--clay)}
.auditline{display:flex; flex-wrap:wrap; gap:4px 14px; margin-top:8px; font-size:.88rem}
.auditline label{display:flex; gap:6px; align-items:center; cursor:pointer}

.toolbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; align-items:center}
.toolbar input[type=search]{flex:1 1 200px}
input[type=text],input[type=search],input[type=email],input[type=url],input[type=number],input[type=date],select,textarea{border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:7px 10px; width:100%; min-width:0}
textarea{resize:vertical; line-height:1.5}
.toolbar select{width:auto}
label.f{display:block; font-size:.86rem; font-weight:500; margin-bottom:12px}
label.f > span{display:block; margin-bottom:4px}
label.f small{display:block; font-weight:400; color:var(--muted); margin-top:3px}
label.c{display:flex; gap:8px; align-items:center; font-size:.9rem; margin-bottom:8px; cursor:pointer}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:0 14px}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:18px; margin-bottom:18px}
.panel h2{margin-bottom:12px}
.note{font-size:.88rem; color:var(--muted)}
ol.steps{margin:10px 0 14px 1.3em; padding:0}
ol.steps li{margin:4px 0}
ol.steps a{color:var(--pine)}
.callout{background:var(--amber-soft); border:1px solid var(--amber); border-radius:8px; padding:10px 12px; font-size:.9rem; margin-bottom:12px}

.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:24px}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px}
.stat b{display:block; font-family:var(--display); font-size:1.7rem; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.1}
.stat span{font-size:.84rem; color:var(--muted)}
table{width:100%; border-collapse:collapse; font-size:.92rem}
th,td{text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top}
th{font-weight:600; color:var(--muted); font-size:.84rem}
td.num{font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.funnel div{display:grid; grid-template-columns:110px minmax(0,1fr) 48px; gap:10px; align-items:center; margin-bottom:6px; font-size:.9rem}
.funnel i{display:block; height:22px; background:var(--pine); border-radius:4px; min-width:3px}
.funnel span:last-child{font-variant-numeric:tabular-nums; text-align:right; font-weight:600}

.veil{position:fixed; inset:0; background:rgba(8,16,14,.45); z-index:20; display:flex; justify-content:flex-end}
.sheet{background:var(--paper); width:min(560px,100%); height:100%; overflow-y:auto; padding:22px 22px calc(60px + env(safe-area-inset-bottom,0px)); padding-top:calc(22px + env(safe-area-inset-top,0px)); border-left:1px solid var(--line)}
.sheet-top{display:grid; grid-template-columns:56px minmax(0,1fr) auto; gap:14px; align-items:start; margin-bottom:14px}
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin:16px 0}
.tabs button{all:unset; cursor:pointer; padding:8px 12px; font-weight:500; border-bottom:2px solid transparent; margin-bottom:-1px}
.tabs button[aria-selected="true"]{border-bottom-color:var(--pine); font-weight:600}
.pills{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px}
.pills button{all:unset; cursor:pointer; padding:5px 11px; border-radius:99px; border:1px solid var(--line); font-size:.86rem; background:var(--surface)}
.pills button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.pills button.done::after{content:" sent"; color:var(--muted); font-size:.78rem}
.pills button[aria-pressed="true"].done::after{color:inherit; opacity:.7}
.row{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; align-items:center}
.pvframe{border:1px solid var(--line); border-radius:10px; height:420px; overflow:auto; background:#fff; margin:12px 0}
#toast{position:fixed; left:50%; bottom:calc(76px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:9px 16px; border-radius:99px; font-size:.9rem; z-index:40; max-width:90vw; opacity:0; pointer-events:none; transition:opacity .2s}
#toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}

@media (max-width:760px){
  .app{display:block}
  .rail{position:fixed; bottom:0; left:0; right:0; z-index:10; padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px)); border-right:0; border-top:1px solid var(--line)}
  .rail-in{position:static; flex-direction:row; gap:0}
  .brand,.rail .foot{display:none}
  .nav{flex-direction:row; flex:1; justify-content:space-around}
  .nav button{flex-direction:column; gap:1px; font-size:.78rem; padding:6px 8px; position:relative}
  .nav .n{position:absolute; top:-2px; right:-2px}
  main{padding:22px 14px 110px}
  .lead{grid-template-columns:48px minmax(0,1fr)}
  .lead .acts{grid-column:1 / -1; justify-content:flex-start}
  .stamp{width:48px; height:48px} .stamp b{font-size:1.35rem}
  .grid2{grid-template-columns:1fr}
  .sheet{padding:16px 14px calc(60px + env(safe-area-inset-bottom,0px)); padding-top:calc(16px + env(safe-area-inset-top,0px))}
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail"><div class="rail-in">
    <div class="brand">Lead Engine<small>Petronix Technology</small></div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="foot" id="foot"></div>
  </div></aside>
  <main id="view" aria-live="off"></main>
</div>
<div id="layer"></div>
<div id="toast" role="status"></div>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const dayNum = iso => { const p = String(iso).split('-').map(Number); return Math.round(Date.UTC(p[0], p[1] - 1, p[2]) / 864e5); };
const addDays = (iso, n) => { const d = new Date((dayNum(iso) + n) * 864e5); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); };
const daysBetween = (a, b) => dayNum(b) - dayNum(a);
const isISO = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s || ''));
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const nice = iso => isISO(iso) ? MONTHS[Number(iso.slice(5, 7)) - 1] + ' ' + Number(iso.slice(8)) : '';
const words = s => (String(s || '').trim().match(/\S+/g) || []).length;
const slug = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'preview';
function merge(t, p){ Object.keys(p).forEach(k => { const v = p[k]; if (v && typeof v === 'object' && !Array.isArray(v) && t[k] && typeof t[k] === 'object') merge(t[k], v); else t[k] = (v && typeof v === 'object') ? clone(v) : v; }); return t; }
let toastTimer;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3200); }
const opt = (v, t, cur) => '<option value="' + v + '"' + (cur === v ? ' selected' : '') + '>' + esc(t) + '</option>';

/* ---------- state ---------- */
const DEFAULTS = {
  sender: '', company: 'Petronix Technology LLC', niche: 'cleaning company',
  price: 129, setup: 199, cur: '$', booking: '', address: '', cap: 30, previewBase: '', cc: '1',
  chan: 'wa', offers: 'site,fix,booking,wa,reviews,gbp,brand',
  headline: 'Reliable cleaning in {city}',
  services: 'House cleaning\nDeep cleaning\nMove-in and move-out cleaning\nOffice cleaning\nRecurring weekly service'
};
const state = {
  leads: {}, settings: Object.assign({}, DEFAULTS), ready: false, mode: 'loading',
  view: 'today', filter: { tier: 'all', status: 'all', wa: 'all', svc: 'all', q: '' }, shown: 100,
  imp: { text: '', rows: null, headers: [], map: {}, city: '', st: '', niche: '', msg: '' },
  drawer: null, busy: null, textbox: null, opened: {}, todayTab: 'wa', gate: '', gateMsg: '',
  find: { what: '', where: '', country: '', countryManual: false, n: 40, ready: null, loading: false, left: null, perMonth: null, busy: false, msg: '', err: '', editKey: false, rejected: false },
  sample: null, downloads: null
};
const KEY = 'lead-engine-v1';
const CHUNK = 50;
const TOUCH = { 1: { day: 1, label: 'Day 1 intro', off: 0 }, 2: { day: 3, label: 'Day 3 follow-up', off: 2 }, 3: { day: 5, label: 'Day 5 call', off: 4 }, 4: { day: 9, label: 'Day 9 final note', off: 8 } };
const STATUS = { new: 'Not contacted', contacted: 'In sequence', replied: 'Replied', booked: 'Call booked', won: 'Client', lost: 'Lost', unsub: 'Unsubscribed', dnc: 'Do not contact' };

/* ---------- storage ---------- */
// Three homes for the data: Claude's shared store, this site's own API, or the browser.
async function apiCall(path, body, method, signal){
  const r = await fetch(path, { method: method || (body ? 'POST' : 'GET'), headers: body ? { 'content-type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined, credentials: 'same-origin', signal });
  let j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok) { const err = new Error((j && j.error) || 'The server did not answer (' + r.status + ').'); err.status = r.status; throw err; }
  return j || {};
}
const apiSample = { json: async (prompt, o) => {
  try { return (await apiCall('/api/personalise', { prompt }, 'POST', o && o.signal)).out; }
  catch (e) { if (e && e.name === 'AbortError') throw { code: 'cancelled' }; if (e && e.status === 429) throw { code: 'rate_limited' }; throw { code: 'server', message: e && e.message }; }
} };
const store = {
  db: null, api: false, docOf: {}, q: Promise.resolve(), pending: 0, pulled: 0,
  enqueue(fn){
    this.pending++;
    this.q = this.q.then(fn).catch(e => { if (e && e.status === 401) { state.gate = 'login'; render(); } toast('Could not save. ' + ((e && e.message) || '')); }).then(() => { this.pending--; });
    return this.q;
  },
  async init(){
    let db = null;
    try { if (window.claude && typeof window.claude.use === 'function') db = await window.claude.use('db'); } catch (e) { db = null; }
    if (db) {
      this.db = db; state.mode = 'cloud';
      db.collection('leadsets').onSnapshot(snap => {
        const leads = {}, docOf = {};
        snap.docs.forEach(d => { const m = (d.data() || {}).leads || {}; Object.keys(m).forEach(id => { if (m[id]) { leads[id] = clone(m[id]); leads[id].id = id; docOf[id] = d.id; } }); });
        state.leads = leads; this.docOf = docOf; state.ready = true; softRender();
      }, () => { state.ready = true; toast('Lost the connection to your saved leads. Reload the page.'); softRender(); });
      db.doc('config/main').onSnapshot(s => { if (s.exists) { state.settings = Object.assign({}, DEFAULTS, s.data()); softRender(); } }, () => {});
      return;
    }
    if (!window.claude && /^https?:$/.test(location.protocol)) {
      try {
        const a = await apiCall('/api/auth');
        if (typeof a.setup === 'boolean') {
          this.api = true; state.mode = 'api';
          if (a.ai) state.sample = apiSample;
          if (!a.authed) { state.gate = a.setup ? 'login' : 'setup'; state.ready = true; return render(); }
          return this.pull();
        }
      } catch (e) {
        if (e && e.status === 503) { state.mode = 'api'; state.gate = 'down'; state.gateMsg = e.message; state.ready = true; return render(); }
      }
    }
    state.mode = 'local';
    try { const raw = localStorage.getItem(KEY); if (raw) { const o = JSON.parse(raw); state.leads = o.leads || {}; state.settings = Object.assign({}, DEFAULTS, o.settings || {}); } } catch (e) { state.mode = 'memory'; }
    state.ready = true; render();
  },
  async pull(){
    try {
      const d = await apiCall('/api/data');
      if (this.pending) return;
      const leads = {}, docOf = {};
      Object.keys(d.sets || {}).forEach(doc => { const m = (d.sets[doc] || {}).leads || {}; Object.keys(m).forEach(id => { if (m[id]) { leads[id] = m[id]; leads[id].id = id; docOf[id] = doc; } }); });
      state.leads = leads; this.docOf = docOf;
      if (d.settings) state.settings = Object.assign({}, DEFAULTS, d.settings);
      state.gate = ''; state.ready = true; this.pulled = Date.now(); softRender();
    } catch (e) {
      if (e && e.status === 401) state.gate = 'login';
      else if (!this.pulled) { state.gate = 'down'; state.gateMsg = (e && e.message) || 'The server did not answer.'; }
      state.ready = true; render();
    }
  },
  save(op){
    if (this.api) return this.enqueue(() => apiCall('/api/data', op));
    const db = this.db;
    if (op.op === 'set') return this.enqueue(() => db.doc('leadsets/' + op.doc).set({ leads: op.leads }));
    if (op.op === 'update') return this.enqueue(() => db.doc('leadsets/' + op.doc).update({ leads: { [op.id]: op.patch } }));
    if (op.op === 'remove') return this.enqueue(() => db.doc('leadsets/' + op.doc).update({ leads: { [op.id]: null } }));
    if (op.op === 'settings') return this.enqueue(() => db.doc('config/main').set(op.settings));
    if (op.op === 'clear') op.docs.forEach(d => this.enqueue(() => db.doc('leadsets/' + d).delete()));
  },
  remote(){ return !!(this.db || this.api); },
  local(){ if (this.remote()) return; try { localStorage.setItem(KEY, JSON.stringify({ leads: state.leads, settings: state.settings })); } catch (e) { state.mode = 'memory'; } },
  add(list){

    }
  },
  update(id, patch){

  remove(id){

  },
  saveSettings(){ if (!this.remote()) return this.local(); this.save({ op: 'settings', settings: clone(state.settings) }); },
  clear(){

    state.leads = {}; this.docOf = {};

    this.save({ op: 'clear', docs });
  }
};

const SOCIAL = /(facebook\.com|fb\.com|fb\.me|instagram\.com|wa\.me|whatsapp\.com|linktr\.ee)/i;
const SERVICES = {
  site:    { name: 'New website', topic: l => 'a website for ' + l.name },
  fix:     { name: 'Website fix-up', topic: () => 'your website' },
  booking: { name: 'Quote and booking form', topic: l => 'a booking form for ' + l.name },
  wa:      { name: 'WhatsApp button and auto-replies', topic: () => 'a WhatsApp button for your website' },
  reviews: { name: 'Google review system', topic: l => 'getting more Google reviews for ' + l.name },
  gbp:     { name: 'Google listing tune-up', topic: () => 'your Google listing' },
  brand:   { name: 'Logo and branding', topic: l => 'a logo for ' + l.name }
};
const PROBLEMS = {
  nosite: { svc: 'site', w: 9 }, social: { svc: 'site', w: 8 }, down: { svc: 'fix', w: 8 },
  nomobile: { svc: 'fix', w: 7 }, nohttps: { svc: 'fix', w: 6 }, slow: { svc: 'fix', w: 6 },
  noform: { svc: 'booking', w: 5 }, lowrating: { svc: 'reviews', w: 5 },
  fewreviews: { svc: 'reviews', w: 4 }, stale: { svc: 'reviews', w: 4 },
  nowa: { svc: 'wa', w: 3 }, gbp: { svc: 'gbp', w: 3 }, brand: { svc: 'brand', w: 2 }
};
const AUDIT = { down: 'Website does not load', slow: 'Slow on mobile', nohttps: 'Not secure (no HTTPS)', nomobile: 'Hard to use on a phone', noform: 'No quote form or booking link', nowa: 'No WhatsApp button' };
const OTHER = { gbp: 'Google listing is incomplete', brand: 'No logo or dated branding' };
const socialKind = u => /facebook|fb\./i.test(u) ? 'Facebook page' : /instagram/i.test(u) ? 'Instagram page' : /wa\.me|whatsapp/i.test(u) ? 'WhatsApp link' : 'link page';
function probLabel(k, l){
  if (k === 'nosite') return 'No website';
  if (k === 'social') return 'Only a ' + socialKind(l.website) + ', no website';
  if (k === 'lowrating') return 'Google rating of ' + l.rating;
  if (k === 'fewreviews') return 'Only ' + l.reviews + ' Google review' + (Number(l.reviews) === 1 ? '' : 's');
  if (k === 'stale') return 'No new Google review in over 6 months';
  return AUDIT[k] || OTHER[k] || k;
}
function offered(){ const o = {}; String(state.settings.offers || '').split(',').forEach(k => { if (SERVICES[k]) o[k] = true; }); return o; }
function assess(l){
  const site = String(l.website || '').trim();
  const hasSite = !!site && !SOCIAL.test(site);
  const a = l.audit || {}, off = offered();
  const reviews = Number(l.reviews) || 0, rating = Number(l.rating) || 0;
  const age = isISO(l.lastReview) ? daysBetween(l.lastReview, todayISO()) : null;
  const recent = l.recentManual === true || (age !== null && age >= 0 && age <= 90);
  const found = [];
  if (!hasSite) found.push(site ? 'social' : 'nosite'); else Object.keys(AUDIT).forEach(k => { if (a[k]) found.push(k); });
  if (rating && rating < 4.3 && reviews >= 10) found.push('lowrating');
  if (reviews >= 1 && reviews < 20) found.push('fewreviews');
  if (age !== null && age > 180 && !l.recentManual) found.push('stale');
  Object.keys(OTHER).forEach(k => { if (a[k]) found.push(k); });
  const probs = found.filter(k => off[PROBLEMS[k].svc]).sort((x, y) => PROBLEMS[y].w - PROBLEMS[x].w);
  const fails = hasSite ? Object.keys(AUDIT).filter(k => a[k]).length : 0;
  const bucket = !hasSite ? 'none' : fails >= 2 ? 'weak' : a.done ? 'ok' : 'unaudited';
  const top = probs[0], autoSvc = top ? PROBLEMS[top].svc : '';
  const manual = !!(l.service && off[l.service]);
  const svc = manual ? l.service : autoSvc;
  const need = top ? (PROBLEMS[top].w >= 8 ? 3 : PROBLEMS[top].w >= 5 ? 2 : 1) : manual ? 1 : 0;
  const sig = { need, reviews: reviews >= 20 && reviews <= 200 ? 3 : 0, recent: recent ? 2 : 0, rating: rating >= 4.3 ? 1 : 0 };
  const score = sig.need + sig.reviews + sig.recent + sig.rating;
  const waiting = !svc && bucket === 'unaudited';
  let why = '';
  if (l.franchise) why = 'Franchise';
  else if (reviews > 200) why = 'Over 200 reviews';
  else if (reviews === 0) why = 'No reviews';
  else if (!svc && !waiting) why = 'No problem found';
  const tier = why ? 'X' : waiting ? 'P' : score >= 7 ? 'A' : score >= 4 ? 'B' : 'C';
  return { hasSite, fails, bucket, sig, score, tier, why, recent, probs, svc, autoSvc };
}
function intl(raw){
  raw = String(raw || '').trim(); const d = raw.replace(/\D/g, '');
  if (!d) return '';
  const cc = String(state.settings.cc || '').replace(/\D/g, '');
  if (raw.charAt(0) === '+') return d;
  if (d.slice(0, 2) === '00') return d.slice(2);
  if (cc && d.slice(0, cc.length) === cc && d.length > 10) return d;
  return cc + d.replace(/^0+/, '');
}
const waNum = l => intl(l.waPhone) || intl(l.phone);
const waUrl = (l, text) => 'https://wa.me/' + waNum(l) + (text ? '?text=' + encodeURIComponent(text) : '');
const MOBILE = { '234': /^[789][01]/, '233': /^[25]/, '254': /^[17]/, '27': /^[6-8]/, '44': /^7/, '971': /^5/, '91': /^[6-9]/ };
function numKind(l){ if (l.pk && !intl(l.waPhone)) return l.pk === 'mobile' || l.pk === 'landline' ? l.pk : ''; const n = waNum(l); for (const cc in MOBILE) if (n.indexOf(cc) === 0) return MOBILE[cc].test(n.slice(cc.length)) ? 'mobile' : 'landline'; return ''; }
function channel(l){

  else if (replied >= 2) gate = '<div class="gate pass"><p><strong>Gate 1 passed: ' + replied + ' replies from ' + contacted + ' leads.</strong> The message works, so automation can start.</p></div>';
  else gate = '<div class="gate fail"><p><strong>Gate 1 not passed: ' + replied + (replied === 1 ? ' reply' : ' replies') + ' from ' + contacted + ' leads.</strong> Rewrite the message or the offer and test another 50.</p></div>';

  const replies = all.filter(x => x.l.status === 'replied' || x.l.status === 'booked');
  const follow = all.filter(x => x.l.status === 'contacted' && x.st && x.st.due <= today).sort((p, q) => p.st.due < q.st.due ? -1 : 1);
  const sentToday = all.filter(x => x.l.t1 === today).length, room = Math.max(0, cap - sentToday);
  const freshAll = all.filter(x => x.l.status === 'new' && x.st && !suppressed(x.l)).sort(byScore);
  const rank = l => ({ mobile: 2, '': 1, landline: 0 })[numKind(l)];
  const toCheck = waMode ? freshAll.filter(x => !x.l.wa && waNum(x.l)).sort((p, q) => rank(q.l) - rank(p.l) || byScore(p, q)) : [];
  const waReady = freshAll.filter(x => x.l.wa === 'yes' && waNum(x.l));
  const others = freshAll.filter(x => waReady.indexOf(x) < 0 && toCheck.indexOf(x) < 0);
  const tab = !waMode ? 'all' : state.todayTab === 'other' ? 'other' : 'wa';
  const pool = tab === 'wa' ? waReady : tab === 'other' ? others : freshAll;
  const fresh = pool.slice(0, room);
  const audits = all.filter(x => x.l.status === 'new' && x.a.bucket === 'unaudited' && !x.a.why).sort(byScore).slice(0, 8);
  const done = all.filter(x => x.l.status === 'contacted' && !x.st && x.l.t4 && daysBetween(x.l.t4, today) >= 5);
  const down = all.filter(x => x.l.previewUrl && x.l.status !== 'won' && lastTouch(x.l) && daysBetween(lastTouch(x.l), today) >= 14);

  const sec = (title, n, hint, body) => '<section class="block"><header><h2>' + title + '</h2><span class="count">' + n + '</span>' + (hint ? '<span class="hint">' + hint + '</span>' : '') + '</header>' + body + '</section>';
  let h = '<div class="head"><h1>Today</h1><p class="sub">' + new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }) + '</p></div>' + gate;

  if (!all.length) return h + '<div class="empty"><p>' + (store.api ? 'No leads yet. Search for a kind of business in any city to fill this page.' : 'No leads yet. Bring in a list from your Google Maps extractor to fill this page.') + '</p><div class="row"><button class="btn primary" data-act="nav" data-view="import">' + (store.api ? 'Find leads' : 'Import leads') + '</button></div></div>';

  if (!state.settings.sender) h += '<div class="callout">Add your name in Settings before you send anything. Until then your messages say [your name].</div>';

  if (replies.length) h += sec('Replies to handle', replies.length, '', replies.map(x => leadCard(x.l, x.a, '<p class="due"><span class="badge s-' + x.l.status + '">' + STATUS[x.l.status] + '</span></p>',
    (x.l.status === 'replied' ? '<button class="btn small" data-act="booked">Call booked</button>' : '') + '<button class="btn small primary" data-act="won">Mark as client</button><button class="btn small" data-act="lost">Lost</button>')).join(''));

  h += sec('Follow-ups due', follow.length, '', follow.length ? follow.map(followCard).join('') : '<div class="empty">Nothing due. Follow-ups appear here 2, 4 and 8 days after the first message.</div>');

  const pills = waMode ? '<div class="pills"><button aria-pressed="' + (tab === 'wa') + '" data-act="today-tab" data-v="wa">On WhatsApp (' + waReady.length + ')</button><button aria-pressed="' + (tab === 'other') + '" data-act="today-tab" data-v="other">Not on WhatsApp (' + others.length + ')</button></div>' : '';
  const none = room === 0 && pool.length ? 'Daily limit reached. ' + pool.length + ' more leads are waiting for tomorrow.'
    : tab === 'wa' ? (toCheck.length ? 'No confirmed WhatsApp leads yet. Check the numbers in the next section.' : 'No WhatsApp leads waiting. Find or import more leads.')
    : tab === 'other' ? 'No leads here. Leads you mark as not on WhatsApp appear in this list for email, calls or DMs.'
    : 'No Tier A or B leads waiting. Import more, or audit the websites below.';
  h += sec(waMode ? 'New leads to message' : 'New leads to contact', fresh.length, sentToday + ' of ' + cap + ' first messages sent today', pills + (fresh.length ? fresh.map(freshCard).join('') : '<div class="empty">' + none + '</div>'));

  if (toCheck.length) h += sec('Check these numbers on WhatsApp', toCheck.length, 'If a chat opens, the number is on WhatsApp',
    toCheck.slice(0, 10).map(checkCard).join('') + (toCheck.length > 10 ? '<p class="note">Showing the first 10. The rest appear as you work through them.</p>' : ''));

  if (audits.length) h += sec('Websites to audit', audits.length, 'Tick what you find, then save', audits.map(x => leadCard(x.l, x.a,
    '<p class="where">' + esc(x.l.website) + '</p><div class="auditline">' + Object.keys(AUDIT).map(k => '<label><input type="checkbox" data-k="' + k + '"' + ((x.l.audit || {})[k] ? ' checked' : '') + '> ' + AUDIT[k] + '</label>').join('') + '</div>',
    '<button class="btn small primary" data-act="audit-save">Save audit</button>')).join(''));

  if (done.length) h += sec('Sequence finished, no reply', done.length, '', done.map(x => leadCard(x.l, x.a, '<p class="due">Last message ' + nice(x.l.t4) + '</p>', '<button class="btn small" data-act="replied">They replied</button><button class="btn small" data-act="lost">Mark lost</button>')).join(''));
  if (down.length) h += sec('Previews to take down', down.length, '14 days since the last message', down.map(x => leadCard(x.l, x.a, '<p class="where">' + esc(x.l.previewUrl) + '</p>', '<button class="btn small" data-act="takedown">Preview taken down</button>')).join(''));
  return h;
}

    if (b) b.disabled = true;
    try { const r = await apiCall('/api/search', { op: 'key', key: k }); Object.assign(f, { ready: !!r.ready, left: r.left == null ? null : r.left, perMonth: r.perMonth == null ? null : r.perMonth, editKey: false, rejected: false, err: '' }); toast('Search is connected.'); render(); }
    catch (e) { if (b) b.disabled = false; if (e && e.status === 401) { state.gate = 'login'; return render(); } toast(e.message || 'Could not save the key.'); }
  },
  parse(){ const im = state.imp, rows = parseTable(im.text); im.fromSearch = ''; if (rows.length < 2) { im.rows = null; im.msg = 'Paste the column names plus at least one business.'; } else { im.rows = rows; im.headers = rows[0]; im.map = guessMap(rows[0]); im.msg = im.map.name < 0 ? 'No business name column was recognised. Pick it below.' : ''; } render(); },
  example(){ state.imp.text = exampleRows(); actions.parse(); },
  'do-import'(){
    const r = readImport(); if (!r.fresh.length && !r.updates.length) return;
    if (r.fresh.length) store.add(r.fresh);
    r.updates.forEach(u => store.update(u.id, u.patch));
    state.imp = { text: '', rows: null, headers: [], map: {}, city: '', st: '', niche: '', msg: '' };
    toast([r.fresh.length ? r.fresh.length + ' leads imported' : '', r.updates.length ? r.updates.length + ' updated' : ''].filter(Boolean).join(', ') + '.'); go('today');
  },
  export(){
    const cols = ['name', 'ownerName', 'email', 'emailVerified', 'phone', 'on_whatsapp', 'whatsapp_number', 'social', 'website', 'category', 'city', 'state', 'rating', 'reviews', 'tier', 'score', 'problems', 'offer', 'finding', 'status', 'previewUrl', 't1', 't2', 't3', 't4', 'note'];
    const q = v => { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    const val = (c, x) => c === 'tier' ? x.a.tier : c === 'score' ? x.a.score : c === 'status' ? STATUS[x.l.status] : c === 'on_whatsapp' ? (x.l.wa || '') : c === 'whatsapp_number' ? (x.l.wa === 'yes' && waNum(x.l) ? '+' + waNum(x.l) : '')
      : c === 'problems' ? x.a.probs.map(k => probLabel(k, x.l)).join('; ') : c === 'offer' ? (x.a.svc ? SERVICES[x.a.svc].name : '') : x.l[c];
    const list = filtered(); if (!list.length) return toast('No leads to export.');
    const csv = cols.join(',') + '\n' + list.map(x => cols.map(c => q(val(c, x))).join(',')).join('\n') + '\n';
    saveFile('leads-' + todayISO() + '.csv', csv, 'Leads as CSV');
  }
};
const reList = () => { state.shown = 100; $('#lead-list').innerHTML = leadList(); };
const changes = {
  field(el){ const id = state.drawer && state.drawer.id; if (!id) return; const f = el.dataset.f; let v = el.type === 'checkbox' ? el.checked : el.value.trim(); if (el.type === 'number') v = v === '' ? '' : Number(v);
    const p = { [f]: v }; if (f === 'website' && /^http:\/\//i.test(v)) p.audit = { nohttps: true };
    store.update(id, p); render(); refreshDrawerHead(); if (/^(website|email|emailVerified|phone|waPhone|rating|reviews|lastReview|recentManual)$/.test(f)) renderDrawer(); },
  audit(el){ const id = state.drawer && state.drawer.id; if (!id) return; store.update(id, { audit: { [el.dataset.k]: el.checked, done: true } }); render(); renderDrawer(); },
  flag(el){ const id = state.drawer && state.drawer.id; if (!id) return; store.update(id, { audit: { [el.dataset.k]: el.checked } }); render(); renderDrawer(); },
  svc(el){ const id = state.drawer && state.drawer.id; if (!id) return; store.update(id, { service: el.value, msgs: { m1: null, m2: null, m3: null, m4: null } }); render(); renderDrawer(); toast('Offer changed. The messages were rewritten to match.'); },
  msg(){ const d = state.drawer; if (!d) return; const sub = $('#msg-subject'); store.update(d.id, { msgs: { ['m' + d.touch]: { subject: sub ? sub.value : (getMsg(state.leads[d.id], d.touch).subject || ''), body: $('#msg-body').value } } }); render(); },
  set(el){ const f = el.dataset.f; let v = el.value; if (el.type === 'number') v = Number(v) || 0; else if (f !== 'services') v = v.trim(); state.settings[f] = v; store.saveSettings(); renderNav(); toast('Saved.'); },
  offer(el){ const off = offered(); off[el.dataset.k] = el.checked; state.settings.offers = Object.keys(SERVICES).filter(k => off[k]).join(','); store.saveSettings(); renderNav(); toast(state.settings.offers ? 'Saved.' : 'Tick at least one service, or no lead will qualify.'); },
  'f-tier'(el){ state.filter.tier = el.value; reList(); },
  'f-svc'(el){ state.filter.svc = el.value; reList(); },
  'f-status'(el){ state.filter.status = el.value; reList(); },
  'f-wa'(el){ state.filter.wa = el.value; reList(); },
  map(el){ state.imp.map[el.dataset.f] = Number(el.value); render(); },
  'find-country'(el){ state.find.country = el.value; state.find.countryManual = !!el.value; },
  'find-n'(el){ state.find.n = Number(el.value) || 40; render(); },
  file(el){ const file = el.files && el.files[0]; if (!file) return; const fr = new FileReader(); fr.onload = () => { state.imp.text = String(fr.result || ''); actions.parse(); }; fr.onerror = () => toast('That file could not be read.'); fr.readAsText(file); }
};
const inputs = {
  q(el){ state.filter.q = el.value; reList(); },
  'find-what'(el){ state.find.what = el.value; },
  'find-where'(el){ const f = state.find; f.where = el.value; if (f.countryManual) return; const g = guessCountry(el.value), code = g ? g.code : ''; if (code !== f.country) { f.country = code; const s = $('#find-country'); if (s) s.value = code; } },
  'imp-text'(el){ state.imp.text = el.value; },
  'imp-city'(el){ state.imp.city = el.value; },
  'imp-st'(el){ state.imp.st = el.value; },
  'imp-niche'(el){ state.imp.niche = el.value; },
  'msg-count'(el){ const c = $('#msg-count'); if (c) c.textContent = words(el.value) + ' words'; const wl = $('#wa-link'), d = state.drawer; if (wl && d && state.leads[d.id]) wl.href = waUrl(state.leads[d.id], el.value); }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  if (b.dataset.confirm && !b.dataset.armed) { b.dataset.armed = '1'; b.dataset.label = b.textContent; b.textContent = b.dataset.confirm; setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = b.dataset.label; } }, 4000); return; }
  const holder = b.closest('[data-id]'), fn = actions[b.dataset.act];
  if (fn) fn(b, holder ? holder.dataset.id : null, e);
});
document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (el && changes[el.dataset.chg]) changes[el.dataset.chg](el); });
document.addEventListener('input', e => { const el = e.target.closest('[data-inp]'); if (el && inputs[el.dataset.inp]) inputs[el.dataset.inp](el); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#layer').firstChild) actions.close();
  if (e.key === 'Enter' && state.gate && e.target.id && /^gate-pw/.test(e.target.id)) actions['gate-go']();
  if (e.key === 'Enter' && !state.gate && /^find-(what|where)$/.test(e.target.id || '')) actions.find();
  if (e.key === 'Enter' && !state.gate && e.target.id === 'find-key') actions['find-key']();
});
document.addEventListener('visibilitychange', autoPull);
setInterval(autoPull, 60000);

/* ---------- start ---------- */
render();
store.init();
if (window.claude && typeof window.claude.use === 'function') {
  window.claude.use('sample').then(s => { state.sample = s || null; if (state.drawer) renderDrawer(); }).catch(() => {});
  window.claude.use('downloads').then(d => { state.downloads = d || null; }).catch(() => {});
}
})();
</script>
</body>
</html>
